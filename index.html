<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialSync Pro</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        /* Navigation Bar Styling */
        nav {
            background-color: #333;
            padding: 1rem;
            text-align: right;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Container to center the Welcome message */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px); /* Subtracts the height of the navbar */
        }

        h1 {
            color: #333;
        }
    </style>
</head>
<body>

    <nav>
        <a href="privacy-policy.html">Privacy Policy</a>
    </nav>

    <div class="main-content">
        <h1>Welcome to SocialSync Pro</h1>
    </div>

</body>
</html>
